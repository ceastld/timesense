name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.0.6, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building 时感 $VERSION (versionCode $CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/timesense.jks"
          echo "TIMESENSE_KEYSTORE=${RUNNER_TEMP}/timesense.jks" >> "$GITHUB_ENV"
          echo "TIMESENSE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TIMESENSE_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "TIMESENSE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            "-PversionName=${{ steps.tag.outputs.version }}" \
            "-PversionCode=${{ steps.tag.outputs.code }}"

      - name: Package APK
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          SRC="app/build/outputs/apk/release/app-release.apk"
          mkdir -p dist
          cp "$SRC" "dist/timesense-${VERSION}-release.apk"
          cp "$SRC" "dist/时感-${VERSION}-release.apk"
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/timesense-${VERSION}-release.apk" \
            "dist/时感-${VERSION}-release.apk" \
            --title "时感 ${VERSION}" \
            --generate-notes
